name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Creer fichier .env
        run: |
          echo "MYSQL_HOST=mysql" >> .env
          echo "MONGODB_HOST=mongo" >> .env
          echo "MYSQL_DB_NAME=mydb" >> .env
          echo "DB_USERNAME=user" >> .env
          echo "DB_PASSWORD=pass" >> .env

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Créer le conteneur
        run: docker compose up -d

      - name: Attendre MySQL
        run: |
          until docker exec mysql \
            mysqladmin ping -h "localhost" -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Exécuter les tests
        run: docker compose exec -T store_manager_app sh -c "PYTHONPATH=/app/src python -m pytest"
