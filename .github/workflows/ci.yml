name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: labo01

    steps:
      - uses: actions/checkout@v4

      - name: Créer fichier .env
        run: |
          echo "MYSQL_HOST=localhost" >> .env
          echo "MONGODB_HOST=localhost" >> .env
          echo "MYSQL_DB_NAME=mydb" >> .env
          echo "DB_USERNAME=user" >> .env
          echo "DB_PASSWORD=pass" >> .env

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Démarrer conteneur de test
        run: docker compose up -d

      - name: Attendre l'initialisation du MySQL
        run: |
          sleep 10
          timeout=60
          until docker exec mysql mysqladmin ping -h localhost -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 3
            timeout=$((timeout - 3))
            if [ $timeout -le 0 ]; then
              echo "MySQL failed to start"
              exit 1
            fi
          done
          sleep 5

      - name: Exécuter les tests
        working-directory: src
        run: python3 -m pytest tests/test_user.py -v

      - name: Déploiement via SSH
        run: |
          # Install SSH client
          sudo apt-get update && sudo apt-get install -y openssh-client

          if [ -z "${{ secrets.SSH_SERVER_HOST }}" ]; then
            echo "ERROR: SSH_SERVER_HOST secret is not set or empty"
            exit 1
          else
            echo "SSH_SERVER_HOST is set"
          fi
          
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known hosts to avoid host key verification prompt
          ssh-keyscan -H ${{ secrets.SSH_SERVER_HOST }} >> ~/.ssh/known_hosts
          
          # Deploy via SSH
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_HOST }} << 'EOF'
            cd log430-a25-labo0
            git pull origin main
          EOF

      - name: Cleanup
        if: always()
        run: docker compose down -v
