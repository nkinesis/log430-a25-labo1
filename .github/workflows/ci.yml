name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker
        run: |
          echo "MYSQL_HOST=mysql" >> .env
          echo "MONGODB_HOST=mongo" >> .env
          echo "MYSQL_DB_NAME=mydb" >> .env
          echo "DB_USERNAME=user" >> .env
          echo "DB_PASSWORD=pass" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for MySQL to be ready
        run: |
          until docker exec mysql \
            mysqladmin ping -h "localhost" -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Wait for MongoDB to be ready
        run: |
          until docker exec mongo \
            mongosh --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

      - name: Install test dependencies in container
        run: |
          docker exec store_manager_app pip install pytest

      - name: Run tests inside container
        run: |
          docker exec store_manager_app bash -c "cd src && python3 -m pytest -v"

      - name: Cleanup
        if: always()
        run: docker compose down -v