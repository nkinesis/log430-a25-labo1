name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: self-hosted
    environment: labo01

    steps:
      - uses: actions/checkout@v4

      - name: Créer fichier .env
        run: |
          echo "MYSQL_HOST=localhost" >> .env
          echo "MONGODB_HOST=localhost" >> .env
          echo "MYSQL_DB_NAME=mydb" >> .env
          echo "DB_USERNAME=user" >> .env
          echo "DB_PASSWORD=pass" >> .env

      - name: Installer les dépendances Python
        run: |
          source /home/guteacher/labo01/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Démarrer conteneur de test
        run: sudo docker compose up -d

      - name: Attendre l'initialisation du MySQL
        run: |
          sleep 10

      - name: Exécuter les tests
        working-directory: src
        run: python3 -m pytest tests/test_user.py -v

      - name: Déploiement via SSH
        run: |
          echo "123"
          
      - name: Cleanup
        if: always()
        run: docker compose down -v
