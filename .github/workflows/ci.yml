name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_HOST=localhost" >> .env
          echo "MONGODB_HOST=localhost" >> .env
          echo "MYSQL_DB_NAME=mydb" >> .env
          echo "DB_USERNAME=user" >> .env
          echo "DB_PASSWORD=pass" >> .env

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait longer for MySQL to be fully ready
        run: |
          echo "Waiting for MySQL to be fully initialized..."
          sleep 10
          
          # Wait for MySQL to accept connections
          timeout=120
          elapsed=0
          until docker exec mysql mysqladmin ping -h localhost -u root -proot --silent; do
            if [ $elapsed -ge $timeout ]; then
              echo "MySQL failed to start within $timeout seconds"
              docker logs mysql
              exit 1
            fi
            echo "MySQL not ready yet... (${elapsed}s/${timeout}s)"
            sleep 3
            elapsed=$((elapsed + 3))
          done
          
          # Additional wait for full initialization
          echo "MySQL is responding, waiting for full initialization..."
          sleep 10

      - name: Test connection with Python before running tests
        run: |
          echo "Testing Python MySQL connection..."
          python3 -c "
          import mysql.connector
          import time
          
          max_retries = 5
          for attempt in range(max_retries):
              try:
                  print(f'Connection attempt {attempt + 1}/{max_retries}')
                  conn = mysql.connector.connect(
                      host='localhost',
                      port=3306,
                      user='user', 
                      password='pass',
                      database='mydb',
                      connection_timeout=10,
                      autocommit=True
                  )
                  cursor = conn.cursor()
                  cursor.execute('SELECT 1')
                  result = cursor.fetchone()
                  print(f'✓ Connection successful! Test result: {result}')
                  cursor.close()
                  conn.close()
                  break
              except Exception as e:
                  print(f'✗ Connection attempt {attempt + 1} failed: {e}')
                  if attempt < max_retries - 1:
                      print('Retrying in 5 seconds...')
                      time.sleep(5)
                  else:
                      print('All connection attempts failed!')
                      raise
          "

      - name: Run tests with verbose output
        working-directory: src
        run: |
          echo "Running tests..."
          python3 -m pytest -v -s --tb=long

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v